<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>FLORES</title>
    <style>
        /* Botón de respuesta de WhatsApp flotante y elegante */
        .btn-whatsapp-final {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background-color: #e91e63;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 14px 32px;
            font-size: 18px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(233, 30, 99, 0.4);
            z-index: 99999;
            text-decoration: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Clase que activa la aparición suave del botón */
        .btn-visible {
            transform: translateX(-50%) scale(1);
        }

        .btn-whatsapp-final:hover {
            background-color: #c2185b;
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.6);
        }
    </style>
</head>

<body class="container">
    <div class="night"></div>
    <div class="flowers">

          <div class="flower__light flower__light--3"></div>
          <div class="flower__light flower__light--4"></div>
          <div class="flower__light flower__light--5"></div>
          <div class="flower__light flower__light--6"></div>
          <div class="flower__light flower__light--7"></div>
          <div class="flower__light flower__light--8"></div>
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
          <div class="flower__line__leaf flower__line__leaf--2"></div>

        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>

          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>
          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>

    </div>

    <button id="btnRespuesta" class="btn-whatsapp-final" onclick="enviarRespuesta()">Clic aquí ❤️</button>

    <script src="main.js"></script>
    <script>
        // Esperamos 4.5 segundos (tiempo suficiente para que la animación termine de completarse)
        setTimeout(function() {
            document.getElementById('btnRespuesta').classList.add('btn-visible');
        }, 4500);

        function enviarRespuesta() {
            var telefono = "51956622688"; // Tu número Edward
            var mensajeRaw = "Mi respuesta es ";
            var urlWhatsapp = "https://api.whatsapp.com/send?phone=" + telefono + "&text=" + encodeURIComponent(mensajeRaw);
            
            window.location.href = urlWhatsapp; // La redirige directamente al chat
        }
    </script>
